[package]
name = "libetebase"
description = "C library for etebase"
homepage = "https://github.com/nikossvnk/libetebase/"
repository = "https://github.com/nikossvnk/libetebase/"
version = "0.5.8"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2018"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
name = "etebase"
crate-type = ["cdylib"]

[build-dependencies]
cbindgen = "^0.29.4"

[dependencies]
etebase = { git = "https://github.com/nikossvnk/etebase-rs", rev = "3ae5348bdf29aaa2f4733f3b88d2bb5b27d330e3" }
