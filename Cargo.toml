[package]
name = "libetebase"
description = "C library for etebase"
homepage = "https://github.com/nikossvnk/libetebase/"
repository = "https://github.com/nikossvnk/libetebase/"
version = "0.5.8"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2018"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
name = "etebase"
crate-type = ["cdylib"]

[build-dependencies]
cbindgen = "^0.14.2"

[dependencies]
etebase = { git = "https://github.com/nikossvnk/etebase-rs", rev = "c0c74b777724777713d0fbbaeb968ba1521aa8e8" } # v0.6.1
