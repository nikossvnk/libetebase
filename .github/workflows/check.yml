name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release

      - name: Check the soname (Linux)
        if: runner.os == 'Linux'
        run: "readelf -d target/release/libetebase.so | grep -F 'Library soname: [libetebase.so.0]'"

      - name: Check the install name (macOS)
        if: runner.os == 'macOS'
        run: otool -D target/release/libetebase.dylib

  test:
    name: C tests against a server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nikossvnk/ciphwren-server
          path: server
          persist-credentials: false

      - name: Start a test server
        run: |
          docker build -t test-server -f server/docker/test-server/Dockerfile --build-arg CIPHWREN_VERSION=ci server
          docker run -d --name test-server -p 127.0.0.1:3735:3735 test-server

      - name: Find the etebase-rs revision
        id: etebase
        run: echo "rev=$(grep -oP '^etebase = .*rev = "\K[0-9a-f]+' Cargo.toml)" >> "$GITHUB_OUTPUT"

      # The C tests use test_user and test_user2 in their fixture state: etebase-rs's tests create
      # and reset them
      - name: Get etebase-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nikossvnk/etebase-rs
          ref: ${{ steps.etebase.outputs.rev }}
          path: etebase-rs
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release

      - name: Set up the test users
        working-directory: etebase-rs
        env:
          ETEBASE_TEST_HOST: 127.0.0.1:3735
        run: |
          timeout 60 sh -c 'until curl -sf -o /dev/null http://$ETEBASE_TEST_HOST/api/v1/authentication/is_etebase/; do sleep 1; done'
          cargo test --test service -- --exact collection_invitations simple_collection_handling

      - name: Run the C tests
        working-directory: c_tests
        env:
          ETEBASE_TEST_API_URL: http://127.0.0.1:3735
        run: make check
